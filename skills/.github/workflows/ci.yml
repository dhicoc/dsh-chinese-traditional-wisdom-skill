name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  visual:
    name: Visual quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/visual
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: apps/visual/pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: install visual deps
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: unit tests
        run: pnpm test:unit
      - name: Skill behavior evals
        run: pnpm eval:skill
      - name: release contracts
        run: pnpm check:release
      - name: BaZi ten-gods oracle guard
        run: python ../../scripts/check_bazi_ten_gods.py
      # 本应用是纯静态产物，prod 审计只覆盖真正随产物考虑的依赖。
      # 构建工具（vite / typescript / tailwindcss / postcss / autoprefixer /
      # @vitejs/plugin-react）与测试工具一律归 devDependencies，不要放回 dependencies，
      # 否则会把构建期的传递依赖（如 tailwindcss>chokidar>braces）算作生产漏洞。
      - name: Node production dependency audit
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org
      - name: Python offline-oracle cold install
        run: |
          python -m pip install --disable-pip-version-check -r ../../requirements.txt
          python -m pip check
          python ../../scripts/check_python_oracles.py
      - name: contracts and smoke checks
        run: |
          node scripts/generate-dream-shards.mjs
          node scripts/smoke-react-shell.mjs
          node scripts/check-doc-contracts.mjs
          node scripts/check-knowledge-references.mjs
          node scripts/generate-knowledge-manifest.mjs --check
          node scripts/check-knowledge-provenance.mjs
          node scripts/check-mapping-schema.mjs
          node scripts/check-react-migration.mjs
          node scripts/generate-char-meaning-shards.mjs --check
          node scripts/generate-dream-shards.mjs --check
          node scripts/generate-knowledge-search-index.mjs --check
          node scripts/check-search-index.mjs
      - name: build
        run: pnpm build
      - name: bundle budget
        run: node scripts/check-bundle-budget.mjs

  playwright-e2e:
    name: Playwright E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit
            browser: webkit
          - project: Mobile Chrome
            browser: chromium
          - project: Mobile Safari
            browser: webkit
    defaults:
      run:
        working-directory: apps/visual
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: apps/visual/pnpm-lock.yaml
      - name: install visual deps
        run: pnpm install --frozen-lockfile
      - name: install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: run Playwright E2E
        run: pnpm test:e2e --project "${{ matrix.project }}"
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/visual/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: apps/visual/test-results/
          if-no-files-found: ignore
          retention-days: 14
